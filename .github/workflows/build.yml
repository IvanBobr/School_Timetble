name: Build EXE and Linux binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write    # необходимо для создания релизов и загрузки файлов
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
          - os: ubuntu-latest
            artifact_suffix: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pdfplumber xlrd

      # ---------- Сборка клиента (Windows) ----------
      - name: Build Client (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "TimetableClient" `
            --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" `
            --hidden-import requests `
            --hidden-import charset_normalizer `
            --hidden-import idna `
            --hidden-import urllib3 `
            --hidden-import certifi `
            --hidden-import tkinter `
            --collect-all requests `
            code/timetable.py

      # ---------- Сборка клиента (Linux) ----------
      - name: Build Client (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name "TimetableClient" \
            --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" \
            --hidden-import requests \
            --hidden-import charset_normalizer \
            --hidden-import idna \
            --hidden-import urllib3 \
            --hidden-import certifi \
            --hidden-import tkinter \
            --collect-all requests \
            code/timetable.py

      # ---------- Сборка сервера (Windows) ----------
      - name: Build Server (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --name "TimetableServer" `
            --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" `
            --hidden-import flask `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import lxml `
            --hidden-import python_docx `
            --hidden-import docx `
            --hidden-import xlrd `
            --hidden-import pdfplumber `
            --hidden-import requests `
            --hidden-import configparser `
            --collect-all flask `
            --collect-all pandas `
            --collect-all openpyxl `
            --collect-all requests `
            --collect-all pdfplumber `
            --collect-all xlrd `
            code/server.py

      # ---------- Сборка сервера (Linux) ----------
      - name: Build Server (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --name "TimetableServer" \
            --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" \
            --hidden-import flask \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import lxml \
            --hidden-import python_docx \
            --hidden-import docx \
            --hidden-import xlrd \
            --hidden-import pdfplumber \
            --hidden-import requests \
            --hidden-import configparser \
            --collect-all flask \
            --collect-all pandas \
            --collect-all openpyxl \
            --collect-all requests \
            --collect-all pdfplumber \
            --collect-all xlrd \
            code/server.py

      # ---------- Загрузка артефактов (промежуточное хранение) ----------
      - name: Upload artifacts (${{ matrix.artifact_suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: TimetableBuild-${{ matrix.artifact_suffix }}
          path: dist/

  # ---------- Публикация в Release (4 файла) ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: TimetableBuild-windows
          path: windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: TimetableBuild-linux
          path: linux

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/TimetableClient.exe
            windows/TimetableServer.exe
            linux/TimetableClient
            linux/TimetableServer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}