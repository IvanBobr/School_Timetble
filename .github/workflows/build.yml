name: Build EXE

on:
  push:
    tags:
      - 'v*'              # запускается при создании тега, начинающегося с v (например, v1.0.0)
  workflow_dispatch:      # позволяет запускать вручную из интерфейса GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pdfplumber

      - name: Build Client
        run: |
          pyinstaller --onefile --windowed --name "TimetableClient" --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" --hidden-import requests --hidden-import charset_normalizer --hidden-import idna --hidden-import urllib3 --hidden-import certifi --hidden-import tkinter --collect-all requests code/timetable.py

      - name: Build Server
        run: |
          pyinstaller --onefile --name "TimetableServer" --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" --hidden-import flask --hidden-import pandas --hidden-import openpyxl --hidden-import lxml --hidden-import python_docx --hidden-import xlrd --hidden-import pdfplumber --hidden-import requests --collect-all flask --collect-all pandas --collect-all openpyxl --collect-all requests --collect-all pdfplumber code/server.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: TimetableBuild
          path: dist/
